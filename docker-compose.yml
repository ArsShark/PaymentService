# Payment Service with its MongoDB and a Kafka broker.
# Usage: copy .env.example to .env, set the MongoDB names and passwords, then run
# "docker compose up --build". The Authentication Service (8081) is not part of this file: it is
# expected on the host, because the application needs it only to check the access tokens, see
# the README. The Compose file of the whole system is in the Infrastructure repository.
#
# To run the application in the IDE instead, start only the two services and publish them on the
# loopback interface of the host with the second file (it is NOT read automatically):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d mongodb kafka
name: payment-service

services:
  app:
    build: .
    image: payment-service:dev
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # The "docker" profile points the application to the hosts "mongodb" and "kafka", which are
      # the service names below. SERVER_PORT, MONGO_PORT and KAFKA_BOOTSTRAP_SERVERS are not
      # passed on purpose: the first must stay 8084, the port that is published below, and the
      # others are the settings of the host (see docker-compose.dev.yml), not of the container.
      SPRING_PROFILES_ACTIVE: docker
      MONGO_DB: ${MONGO_DB:-payment_service_db}
      MONGO_USERNAME: ${MONGO_USERNAME:?MONGO_USERNAME is required, see .env.example}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required, see .env.example}
      # The access tokens are checked with the public key of the Authentication Service, at its
      # internal address (never the Gateway). In a standalone Compose it runs on the host, so the
      # default is the host; the Compose file of the whole system sets the service name. The
      # issuer must be the same as JWT_ISSUER of the Authentication Service. Do not put a
      # "localhost" address into AUTH_JWKS_URI of .env: in a container it is the container itself.
      AUTH_JWKS_URI: ${AUTH_JWKS_URI:-http://host.docker.internal:8081/.well-known/jwks.json}
      JWT_ISSUER: ${JWT_ISSUER:-authentication-service}
      # The random number service on the internet (the same default as application.yml).
      RANDOM_API_URI: ${RANDOM_API_URI:-https://www.random.org}
    # host.docker.internal is the host of the machine (the Authentication Service runs there when
    # this file is used alone).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8084:8084"
    volumes:
      - app-logs:/app/logs

  mongodb:
    image: mongo:8
    environment:
      # The administrator. The image creates it on the first start (the data volume must be
      # empty), in the database "admin". The application does not use it. Changing the values
      # later changes nothing: see the README.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required, see .env.example}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required, see .env.example}
      # The user of the application, created by the script below on the same first start, with
      # the role readWrite on the database of the application and nothing else.
      MONGO_APP_USERNAME: ${MONGO_USERNAME:?MONGO_USERNAME is required, see .env.example}
      MONGO_APP_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required, see .env.example}
      MONGO_APP_DATABASE: ${MONGO_DB:-payment_service_db}
    volumes:
      - mongo-data:/data/db
      # The image runs every script of this directory once, on the first start of an empty volume.
      - ./docker/mongodb/01-create-app-user.js:/docker-entrypoint-initdb.d/01-create-app-user.js:ro
    healthcheck:
      # Logs in as the USER OF THE APPLICATION, so it passes only after the script has created
      # it. The administrator would not do: the image creates it first, and the temporary server
      # of the first start (it listens on 127.0.0.1 only, like this command) would answer before
      # the script has run. A failed login makes mongosh exit with an error. The string form of
      # "test" runs the command in the shell of the container, like CMD-SHELL. "$$" keeps Compose
      # from interpolating the variables: the shell of the container does.
      test: mongosh --quiet -u "$$MONGO_APP_USERNAME" -p "$$MONGO_APP_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping')"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  kafka:
    # One broker in KRaft mode: this single process is both the broker and the controller, there
    # is no ZooKeeper. Only the application of this project uses it, so there is one listener for
    # containers and no published port; docker-compose.dev.yml adds a listener for the host. The
    # image reads every KAFKA_* variable into its configuration and a variable replaces the
    # default, so the set below is complete on purpose.
    image: apache/kafka:4.2.0
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL is for containers of this Compose project (kafka:19092), CONTROLLER is the
      # private port of the KRaft quorum. A client goes to the ADVERTISED address of the
      # listener it connected to, so the address must work for the client that uses it.
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # One broker cannot keep more than one copy of anything, so the internal topics of Kafka
      # (consumer offsets, transactions) must have one replica, or the broker does not start.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # A topic is created on purpose (by the application), never by a typo in its name.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    # No volume: the data of a development broker is disposable (topics are created again by
    # the application, the history of the events is not needed). "docker compose down" resets it.
    healthcheck:
      # The string form of "test" runs in the shell of the container. The tool exits with an
      # error while the broker does not answer.
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  mongo-data:
  app-logs:
