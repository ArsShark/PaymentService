name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Push the Docker image to GHCR even from a branch other than main
        type: boolean
        default: false

permissions:
  contents: read

# A newer run of the same branch or pull request replaces the older one.
# Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          # SonarQube needs the full history to find new code and blame information.
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: ./mvnw -B -ntp -DskipTests package

      # All tests, including the integration tests: Testcontainers starts MongoDB and Kafka in
      # Docker, which is available on GitHub-hosted runners (a container can be paused there too,
      # which the Kafka outage test does). The tests need no secrets: the random number service
      # and the key set of the Authentication Service are played by servers inside the tests, and
      # the tests set every setting themselves. About two minutes on a developer machine; the first
      # run on a runner also pulls the images of MongoDB and Kafka.
      - name: Test
        run: ./mvnw -B -ntp test

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # The image is built on every run (this checks the Dockerfile) but pushed to GHCR
      # only on pushes to main, or on a manual run with "publish" ticked.
      PUBLISH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      # The actions of the "docker" organization are pinned to a commit SHA, not to a tag: a tag can
      # be moved, and these steps run with the GITHUB_TOKEN that may write packages. The comment
      # names the release; a version is changed by replacing the SHA after checking the release.
      # The GitHub-owned actions (actions/*) stay on a major tag.
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR needs a lowercase image name; the action lowercases it.
      # The tags are "sha-<short commit id>" and, on the default branch only, "latest".
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # The image is built into the local Docker daemon under the name that docker-compose.yml
      # uses, so that the next steps start exactly this image. The layers go to the cache of the
      # workflow, which the step "Push the image" reads.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: payment-service:dev
          labels: ${{ steps.meta.outputs.labels }}
          # Keeps the package a single plain image, without extra attestation manifests.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Compose file of the repository, as a developer runs it: the application image just
      # built, MongoDB with its init script and Kafka. The placeholders of .env.example are good
      # enough (nothing here is a secret). The image is not built again (--no-build); the step
      # waits until the services are running or, for MongoDB and Kafka, healthy. A failure that
      # shows only in a container (the executable jar, the init script, the user of the process)
      # stops the job here and not in the system Compose file.
      - name: Start the service with MongoDB and Kafka
        id: system
        run: |
          docker compose version
          cp .env.example .env
          docker compose up --detach --no-build --wait --wait-timeout 180
          docker compose ps

      # The service has no health endpoint before the Kubernetes task. A request without a token
      # is answered with the 401 of the security chain, so the answer proves that the context
      # started: the Liquibase changelog ran on MongoDB, the Kafka producer and the key set
      # settings were read, the web server listens.
      - name: Wait for the application
        run: |
          status=000
          for attempt in $(seq 1 60); do
            status=$(curl --silent --output response.json --write-out '%{http_code}' http://localhost:8084/api/payments/my || true)
            if [ "$status" = "401" ]; then
              break
            fi
            sleep 2
          done
          echo "HTTP status of the last request: $status"
          test "$status" = "401"
          cat response.json
          grep -q 'Authentication is required' response.json

      - name: Check the container and the topic
        run: |
          user=$(docker compose exec -T app id -un)
          echo "The application runs as: $user"
          test "$user" = "app"
          found=no
          for attempt in $(seq 1 15); do
            # The output goes to a variable first: "grep -q" closes the pipe at the first match and
            # the shell of the runner runs with pipefail, so a pipe would fail for no reason.
            topics=$(docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list || true)
            if grep -qx 'payment-events' <<< "$topics"; then
              found=yes
              break
            fi
            sleep 2
          done
          echo "The topic payment-events exists: $found"
          test "$found" = "yes"

      - name: Show the logs of the containers
        if: failure() && steps.system.conclusion != 'skipped'
        run: docker compose logs --no-color --timestamps

      - name: Stop the service
        if: always() && steps.system.conclusion != 'skipped'
        run: docker compose down --volumes --remove-orphans

      # The same layers again, from the cache of the step "Build the image".
      - name: Push the image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
