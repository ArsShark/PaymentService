spring:
  application:
    name: payment-service
  profiles:
    # Used when no profile is set (IDE, .\mvnw spring-boot:run).
    default: local
  mongodb:
    # Host, port and database are defined per profile (application-local.yml).
    # The credentials have no defaults and are never stored in the repository.
    username: ${MONGO_USERNAME}
    password: ${MONGO_PASSWORD}
    authentication-database: ${MONGO_AUTH_DB:admin}
  data:
    mongodb:
      # Spring Data MongoDB 5 has no default for BigDecimal: it must be chosen. Decimal128 is
      # the numeric type of MongoDB, so amounts can be compared and added up by the database.
      representation:
        big-decimal: decimal128
      # Liquibase is the only owner of the indexes; annotations never create one.
      auto-index-creation: false
  kafka:
    # The address of the broker is defined per profile (application-local.yml).
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      # The broker confirms a record only after all in-sync replicas have it. Together with the
      # idempotent producer this means: a retry of the producer never writes a record twice.
      acks: all
      properties:
        "[enable.idempotence]": true
        # The limits that matter to a payment request. send() waits at most "max.block.ms" for
        # the metadata of the topic (this is the only wait on the HTTP thread, the delivery
        # itself is asynchronous); the producer retries a record in the background for
        # "delivery.timeout.ms" and then gives up. The producer refuses to start if
        # delivery.timeout.ms is smaller than linger.ms + request.timeout.ms.
        "[max.block.ms]": 2000
        "[request.timeout.ms]": 5000
        "[delivery.timeout.ms]": 30000
        # The events carry no Java type: every service has its own class for them.
        "[spring.json.add.type.headers]": false
server:
  port: ${SERVER_PORT:8084}
app:
  security:
    # Must equal the issuer of the Authentication Service (JWT_ISSUER there).
    jwt-issuer: ${JWT_ISSUER:authentication-service}
  random-api:
    # The random number service that decides a payment (even: SUCCESS, odd: FAILED). It is the
    # same in every environment, so unlike the addresses of the other services of the system the
    # default is here and not in a profile file. Tests and a local stand-in replace it.
    base-uri: ${RANDOM_API_URI:https://www.random.org}
logging:
  level:
    # The Kafka client logs every configuration value at INFO, again for every client.
    org.apache.kafka: WARN
