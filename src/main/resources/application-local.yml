# Profile "local": the application runs on the host (IDE or .\mvnw spring-boot:run),
# MongoDB is reachable on localhost. Environment variables override every default.
# Credentials (MONGO_USERNAME, MONGO_PASSWORD) have no defaults and are never stored in this file.
spring:
  config:
    # The .env file of Docker Compose is read too, if it exists in the working directory, so the
    # IDE needs no environment variables of its own. Real environment variables win over it.
    # The file is read as Java properties here, so a value must not be in quotes.
    import: optional:file:.env[.properties]
  mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${MONGO_DB:payment_service_db}
  kafka:
    # The broker of docker-compose.yml, published on the loopback interface.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app:
  security:
    # The internal address of the Authentication Service, never the address of the API
    # Gateway.
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
