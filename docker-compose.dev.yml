# For the application that runs on the host (the IDE or .\mvnw spring-boot:run, profile "local").
# It is NOT read automatically: the name is not docker-compose.override.yml on purpose, so a plain
# "docker compose up" starts the containerized setup of docker-compose.yml, where nothing but the
# application is published. Start only the two services (the application runs on the host):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d mongodb kafka
# This file only ADDS to docker-compose.yml: the published ports and a listener of Kafka for the
# host. Both ports are on the loopback interface, so nothing outside the machine can reach them.
services:
  mongodb:
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"

  kafka:
    environment:
      # EXTERNAL is the listener for the host (localhost:9092). Its advertised address uses the
      # same port as the published one, so a changed KAFKA_PORT works for both. The values
      # replace the ones of docker-compose.yml, so the INTERNAL listener is repeated here.
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
